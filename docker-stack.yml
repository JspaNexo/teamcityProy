# Despliegue de ApplicationDemo en Docker Swarm.
#
#   docker stack deploy -c docker-stack.yml applicationdemo
#
# Swarm no construye imágenes: la imagen debe estar en un registro o existir en cada nodo.
#   IMAGEN: repositorio de la imagen; por defecto, applicationdemo (imagen local).
#           TeamCity usa la del registro local: localhost:5000/applicationdemo.
#   TAG:    versión a desplegar; por defecto, latest.
# En TeamCity, scripts/reemplazar-tokens-swarm.sh genera docker-stack.Temp.yml con ambos valores ya reemplazados.

version: "3.8"

services:
  api:
    image: ${IMAGEN:-applicationdemo}:${TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    deploy:
      replicas: 3
      # Actualización gradual: levanta la réplica nueva, espera su healthcheck y recién entonces baja la anterior
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 30s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
